<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8">
    <!-- Etiqueta de Google (GTM-M2C2NSXD): Analytics y demás etiquetas se administran desde Google Tag Manager -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-M2C2NSXD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <link rel="canonical" href="%SITE_URL%/">
    <meta name="author" content="%SITE_NAME%">
    <meta name="theme-color" content="#0E1012">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_CO">
    <meta property="og:site_name" content="%SITE_NAME%">
    <meta property="og:title" content="%SEO_TITLE%">
    <meta property="og:description" content="%SEO_DESCRIPTION%">
    <meta property="og:url" content="%SITE_URL%/">
    <meta property="og:image" content="%SEO_IMAGE%">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="%SEO_IMAGE_ALT%">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="%SEO_TITLE%">
    <meta name="twitter:description" content="%SEO_DESCRIPTION%">
    <meta name="twitter:image" content="%SEO_IMAGE%">
    <meta name="twitter:image:alt" content="%SEO_IMAGE_ALT%">

    <!--structured-data-->
